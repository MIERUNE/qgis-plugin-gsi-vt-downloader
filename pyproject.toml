[project]
name = "gsi-vt-downloader"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "pyqt5-stubs>=5.15.6.0",
    "ruff>=0.8.2",
]


[tool.bandit]
exclude_dirs = [
    ".venv",  # uv sync creates it inside the repo, including in CI
    "tests",  # test code legitimately uses assert (B101)
]


[tool.ruff.lint]
ignore = [
    "E722",  # bare except
    "E721",  # type comparison
    "E741",  # ambiguous variable name
    "E701",  # multiple statements on one line
    "E713",  # not in
    "F401",  # unused import
    "F822",  # undefined name in __all__
    "F841",  # unused variable
]
